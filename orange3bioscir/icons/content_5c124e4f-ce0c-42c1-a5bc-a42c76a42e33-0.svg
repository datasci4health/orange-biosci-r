<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">

  <!-- DNA double helix — back strands (lighter gray = depth) -->
  <path d="M24,2 Q14,10 24,18" stroke="#b0b0b0" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M24,18 Q14,26 24,34" stroke="#b0b0b0" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M24,34 Q14,42 24,46" stroke="#b0b0b0" stroke-width="2.8" fill="none" stroke-linecap="round"/>

  <!-- Base-pair rungs (split gap = hydrogen bonds / informatics texture) -->
  <line x1="17" y1="10" x2="21.5" y2="10" stroke="#999" stroke-width="2" stroke-linecap="round"/>
  <line x1="26.5" y1="10" x2="31" y2="10" stroke="#999" stroke-width="2" stroke-linecap="round"/>
  <line x1="17" y1="26" x2="21.5" y2="26" stroke="#999" stroke-width="2" stroke-linecap="round"/>
  <line x1="26.5" y1="26" x2="31" y2="26" stroke="#999" stroke-width="2" stroke-linecap="round"/>
  <line x1="17" y1="42" x2="21.5" y2="42" stroke="#999" stroke-width="2" stroke-linecap="round"/>
  <line x1="26.5" y1="42" x2="31" y2="42" stroke="#999" stroke-width="2" stroke-linecap="round"/>

  <!-- DNA double helix — front strands (dark = foreground) -->
  <path d="M24,2 Q34,10 24,18" stroke="#1a1a1a" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M24,18 Q34,26 24,34" stroke="#1a1a1a" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M24,34 Q34,42 24,46" stroke="#1a1a1a" stroke-width="2.8" fill="none" stroke-linecap="round"/>

</svg>